spring:
  datasource:
    url: jdbc:h2:mem:user-service-db;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE;MODE=PostgreSQL;
#    url: jdbc:h2:file:C:/Temp/user-service;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE;MODE=PostgreSQL;
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /db
      settings.trace: false
  security:
    user:
      name: admin
      password: secret
jjwt:
  secret: a-very-long-secret-key-to-avoid-WeakKeyExceptions
  expiration-delay: 3600000 # 1 hour