apiVersion: apps/v1
kind: Deployment
metadata:
  name: @k8s.name@
  labels:
    app: @k8s.name@
spec:
  replicas: 1
  selector:
    matchLabels:
      app: @k8s.name@
  template:
    metadata:
      labels:
        app: @k8s.name@
    spec:
      containers:
        - name: @k8s.name@
          image: ghcr.io/dmasc/@project.artifactId@:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: @k8s.name@
spec:
  selector:
    app: @k8s.name@
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort